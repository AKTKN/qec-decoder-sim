[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "relay-post-selection"
version = "0.1.0"
description = "Post-selection simulation pipeline using relay-bp"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "stim",
    "pyarrow",
    "polars",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
relay-post-selection = "relay_post_selection.__main__:main"
